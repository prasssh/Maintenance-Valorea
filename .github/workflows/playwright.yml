name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Check Pantheon site
        run: |
          echo "Checking site..."
          curl -I --max-time 30 https://test-valorea.pantheonsite.io
          echo "Site check completed"

      - name: Run Playwright Tests
        run: |
          echo "Starting Playwright..."
          npx playwright --version
          echo "Running tests..."
          timeout --signal=TERM --kill-after=30s 10m npx playwright test --workers=1 --reporter=line

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30